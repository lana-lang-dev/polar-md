[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bear-markdown-desktop"
version = "2.0.0"
description = "A native, local-first, single-document Markdown editor"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "markdown-it-py>=3.0,<5", "mdit-py-plugins>=0.4,<1", "PyYAML>=6.0,<7", "Pygments>=2.18,<3"]

[project.scripts]
bear-markdown = "bear_editor.app:main"

[tool.setuptools.packages.find]
include = ["bear_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
